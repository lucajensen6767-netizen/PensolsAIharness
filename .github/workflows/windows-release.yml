name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Run tests
        run: python -m unittest -v test_ai_harness.py

      - name: Build desktop package
        shell: pwsh
        run: |
          python -m PyInstaller --noconsole --clean --name "AI Harness" --add-data "config.json;." desktop_app.py
          New-Item -ItemType Directory -Force "dist\AI Harness Desktop" | Out-Null
          Copy-Item "dist\AI Harness\AI Harness.exe" "dist\AI Harness Desktop\"
          Copy-Item "README.md" "dist\AI Harness Desktop\"
          Copy-Item "config.json" "dist\AI Harness Desktop\"
          Compress-Archive -Path "dist\AI Harness Desktop\*" -DestinationPath "dist\AI-Harness-Windows.zip" -Force

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AI-Harness-Windows.zip
            dist/AI Harness/AI Harness.exe
